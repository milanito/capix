packages:
  - "packages/*"
  - "packages/transports/*"
  - "packages/plugins/*"
  - "packages/stores/*"
  - "cli"
  - "examples/*"
  - "test/integration"
  - "benchmarks"

allowBuilds:
  '@biomejs/biome': true
  esbuild: true
  msgpackr-extract: true

overrides:
  # vitepress@1.6.4 (latest) still declares "vite": "^5.4.14" — none of the 3
  # open vite CVEs are patched below 6.4.x. vitest's own peer range already
  # accepts 6.x (^5.0.0 || ^6.0.0 || ^7.0.0-0). Verified against
  # `pnpm docs:build` + full test suite after bumping pnpm itself to make
  # this override actually reach vitepress's nested copy (pnpm 9.0.0
  # couldn't; pnpm 11 can).
  vite: ^6.4.3
  # hyperid@3.3.0 (via benchmarks' autocannon devDependency) pins an old
  # uuid; the fix landed in hyperid 4.x, which autocannon hasn't adopted.
  # benchmarks/ is a private, unpublished comparison tool.
  uuid: ^11.1.1
