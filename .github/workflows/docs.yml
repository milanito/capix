name: Deploy docs

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'package.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs
        run: pnpm docs:build
        env:
          VITEPRESS_BASE: /capix/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/website

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # deploy-pages fails transiently on GitHub's side (~half our runs;
      # build never fails) and a manual relaunch always lands it — so
      # retry once automatically after a pause instead.
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true

      - name: Pause before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - uses: actions/deploy-pages@v4
        id: retry
        if: steps.deployment.outcome == 'failure'
